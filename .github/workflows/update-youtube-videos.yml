name: Update latest YouTube videos

on:
  schedule:
    # Check four times a day.  workflow_dispatch also makes a missed update
    # recoverable immediately from the Actions tab.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-youtube-videos
  cancel-in-progress: false

jobs:
  update-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-youtube-videos.mjs
      - name: Commit changed videos
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update latest YouTube videos"
          git push
