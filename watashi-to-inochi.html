<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わたしといのち</title>
<style>
  :root {
    --night: #0d1320;
    --ink: #f2e8d6;
    --muted: rgba(242, 232, 214, 0.76);
    --faint: rgba(242, 232, 214, 0.54);
    --line: rgba(225, 177, 112, 0.24);
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: var(--night);
  }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--night);
    color: var(--ink);
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Noto Serif JP", serif;
    letter-spacing: 0.04em;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(9, 17, 31, 0.60) 0%, rgba(12, 19, 31, 0.34) 48%, rgba(88, 54, 27, 0.14) 100%),
      linear-gradient(180deg, rgba(9, 16, 28, 0.12) 0%, rgba(11, 17, 27, 0.56) 100%),
      url("./images/quiet-night-desk.png") center center / cover no-repeat;
    filter: brightness(1.18) saturate(1.04) contrast(0.94);
    transform: scale(1.02);
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 68% 36%, rgba(225, 166, 92, 0.24), transparent 31%),
      radial-gradient(circle at 22% 38%, rgba(30, 55, 85, 0.24), transparent 48%),
      linear-gradient(90deg, rgba(11, 18, 32, 0.18), rgba(93, 56, 28, 0.08));
    z-index: 1;
  }

  .page {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    padding: clamp(64px, 9vw, 120px) clamp(24px, 8vw, 112px);
  }

  .content {
    width: min(100%, 660px);
  }

  .quiet-line {
    width: 72px;
    height: 1px;
    margin: 0 0 30px;
    background: var(--line);
  }

  h1 {
    margin: 0 0 clamp(34px, 5vw, 62px);
    font-size: clamp(28px, 4vw, 52px);
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: 0.10em;
    text-shadow: 0 1px 26px rgba(4, 6, 12, 0.46);
  }

  .audio-wrap {
    width: min(100%, 430px);
    margin: 0 0 clamp(52px, 7vw, 86px);
  }

  audio {
    width: 100%;
    height: 34px;
    display: block;
    filter: sepia(0.22) saturate(0.76) brightness(0.82);
    opacity: 0.76;
  }

  .body-text {
    color: var(--muted);
    font-size: clamp(16px, 1.55vw, 19px);
    line-height: 2.35;
    text-shadow: 0 1px 18px rgba(3, 5, 10, 0.46);
    white-space: pre-line;
  }

  .body-text p {
    margin: 0 0 2.2em;
  }

  @media (max-width: 720px) {
    body::before {
      background:
        linear-gradient(180deg, rgba(10, 17, 29, 0.58) 0%, rgba(10, 17, 29, 0.36) 48%, rgba(12, 18, 28, 0.64) 100%),
        url("./images/quiet-night-desk.png") 64% center / cover no-repeat;
    }
  }
</style>
</head>
<body>
  <main class="page" aria-labelledby="page-title">
    <article class="content">
      <div class="quiet-line" aria-hidden="true"></div>
      <h1 id="page-title">わたしといのち</h1>

      <div class="audio-wrap">
        <audio controls preload="metadata" src="./audio/voice-narration.mp3">
          音声
        </audio>
      </div>

      <div class="body-text" aria-label="本文全文">私は「わたし」と思って生きている

でもそれは本当だろうか

私は「いのち」

心臓は鼓動している

いつから？

「わたし」が生まれるずっと前から

そう
それはいのちが芽生えた時

遅れて「わたし」はやってきた
「わたし」の人生を生き始めた

「わたし」のあたまより
「わたし」のこころより
ずっとずっと遠い昔から
「わたし」のいのちは生きていた

そしていまも生きている
これからもずっと生きていく

いのちから「わたし」は離れすぎたかな？

いのちにかえろう
いま　この疲れと痛みが引くまでは</div>
    </article>
  </main>
</body>
</html>
